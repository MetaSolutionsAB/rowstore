server.port=8282
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
management.endpoints.web.exposure.include=health,info,metrics
server.server-header=RowStore
# X-Forwarded-For is evaluated by TrustedProxyFilter ("trustedproxies" in rowstore.json); never auto-enable
# Tomcat's RemoteIpValve, which Spring Boot does by default on detected cloud platforms such as Kubernetes
server.forward-headers-strategy=none
spring.threads.virtual.enabled=true
spring.main.banner-mode=off
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
