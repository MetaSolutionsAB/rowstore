server.port=8282
# The data sources and the Flyway migration are set up by DataSourceConfig from rowstore.json; Flyway's
# auto-configuration is not on the classpath (no spring-boot-flyway dependency)
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
management.endpoints.web.exposure.include=health,info,metrics
# The database is checked by RowStoreHealthIndicator, whose connection is limited like all others (ARCH-7)
management.health.db.enabled=false
server.server-header=RowStore
# X-Forwarded-For is evaluated by TrustedProxyFilter ("trustedproxies" in rowstore.json); never auto-enable
# Tomcat's RemoteIpValve, which Spring Boot does by default on detected cloud platforms such as Kubernetes
server.forward-headers-strategy=none
spring.threads.virtual.enabled=true
spring.main.banner-mode=off
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Streamed exports must not be cut off by the default async request timeout (30 s in Tomcat); 1.x had no limit
spring.mvc.async.request-timeout=-1
# Characters that clients send unencoded in query strings, e.g., regular expressions (^, |, [, ], {, }, \), which
# Tomcat rejects with 400 by default; 1.x (Jetty) accepted them (QUERY-9.03)
server.tomcat.relaxed-query-chars=^,|,[,],{,},\\,",<,>,`
# Request bodies of PUT, PATCH and DELETE are never form parameters; the filter would consume e.g. a JSON array of
# aliases sent with Content-Type application/x-www-form-urlencoded (API-3.09)
spring.mvc.formcontent.filter.enabled=false
