name = PropertiesConfig
appenders = console

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %replace{%msg}{\r?\n}{\u21B5}%n

rootLogger.level = INFO
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT

# A failure of the embedded Tomcat's startup (e.g., an invalid rowstore.json, CFG-1.03) is reported by Spring Boot
# when the context has failed; DeferredServletContainerInitializers would log it once more at ERROR level, with the
# bean creation chain
logger.tomcatinit.name = org.springframework.boot.tomcat.servlet.DeferredServletContainerInitializers
logger.tomcatinit.level = OFF
# springdoc warns at every start that /v3/api-docs and /swagger-ui.html are enabled; they are served on purpose and
# must be blocked by the reverse proxy (SEC-9)
logger.springdocinit.name = org.springdoc.core.events.SpringDocAppInitializer
logger.springdocinit.level = ERROR
